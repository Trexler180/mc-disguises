plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.1'
	id 'maven-publish'
}

def javaRelease = 25

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "shedaniel"
		url = 'https://maven.shedaniel.me/'
		content {
			includeGroup "me.shedaniel.cloth"
			includeGroup "me.shedaniel"
		}
	}
	maven {
		name = "TerraformersMC"
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup "com.terraformersmc"
		}
	}
	maven {
		name = "lucko"
		url = 'https://oss.sonatype.org/content/repositories/snapshots'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"disguises" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Keep MixinExtras bundled explicitly for compatibility with expression injections.
	include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.0"))

	// Cloth Config (optional - for ModMenu config screen)
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ModMenu (optional)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", "~${project.minecraft_version}"
	inputs.property "loader_dependency", ">=${project.loader_version}"
	inputs.property "java_dependency", ">=${javaRelease}"
	inputs.property "modmenu_entrypoint", "com.coffee.disguises.client.compat.ModMenuApiImpl"
	filesMatching("fabric.mod.json") {
		expand(
				"version": project.version,
				"minecraft_dependency": "~${project.minecraft_version}",
				"loader_dependency": ">=${project.loader_version}",
				"java_dependency": ">=${javaRelease}",
				"modmenu_entrypoint": "com.coffee.disguises.client.compat.ModMenuApiImpl"
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// withSourcesJar() intentionally removed — triggers a Loom 1.14 javadoc
	// remapping error when using Mojang mappings with newer Fabric API modules
	// that don't declare an intermediary source namespace in their javadoc jars.
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.register("buildMc2612", Exec) {
	group = "build"
	description = "Builds the alternate Minecraft 26.1.2 jar without changing the main target."
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine "cmd", "/c", "gradlew.bat", "-p", "versions/26.1.2", "build"
	} else {
		commandLine "./gradlew", "-p", "versions/26.1.2", "build"
	}
}

tasks.register("buildMc12111", Exec) {
	group = "build"
	description = "Builds the alternate Minecraft 1.21.11 jar without changing the main target."
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine "cmd", "/c", "gradlew.bat", "-p", "versions/1.21.11", "build"
	} else {
		commandLine "./gradlew", "-p", "versions/1.21.11", "build"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
