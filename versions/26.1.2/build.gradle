plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.16.1'
	id 'maven-publish'
}

def repoRoot = file("../..")
def rootProperties = new Properties()
file("${repoRoot}/gradle.properties").withInputStream { rootProperties.load(it) }

def minecraftVersion = "26.1.2"
def loaderVersion = "0.19.2"
def fabricVersion = "0.146.1+26.1.2"
def clothConfigVersion = "26.1.154"
def modmenuVersion = "18.0.0-alpha.8"
def javaRelease = 25
def archiveBaseName = rootProperties.getProperty("archives_base_name")
def resourceVersion = rootProperties.getProperty("mod_version")

version = resourceVersion
group = rootProperties.getProperty("maven_group")

base {
	archivesName = archiveBaseName
}

repositories {
	mavenCentral()
	maven {
		name = "shedaniel"
		url = 'https://maven.shedaniel.me/'
		content {
			includeGroup "me.shedaniel.cloth"
			includeGroup "me.shedaniel"
		}
	}
	maven {
		name = "Modrinth"
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "lucko"
		url = 'https://oss.sonatype.org/content/repositories/snapshots'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"disguises" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDirs = ["${repoRoot}/src/main/java"]
		resources.srcDirs = ["${repoRoot}/src/main/resources"]
	}
	client {
		java.srcDirs = ["${repoRoot}/src/client/java"]
	}
}

// Excludes the 26.2-only sources and compiles rewritten copies of them instead,
// so this target shares src/main/java with the primary build.
apply from: "${repoRoot}/gradle/legacy-sources.gradle"
applyLegacySources("${repoRoot}")

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	// 26.1.2 official Mojang mappings are not published for download, so this build
	// consumes the committed merged tiny mappings instead. Loom expects a jar that
	// contains mappings/mappings.tiny (mappings.jar is packed from the repo-root tiny).
	mappings files("mappings.jar")
	modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

	// Keep MixinExtras bundled explicitly for compatibility with expression injections.
	include(modImplementation("io.github.llamalad7:mixinextras-fabric:0.5.0"))

	// Cloth Config (optional - for ModMenu config screen)
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ModMenu (optional)
	modCompileOnly "maven.modrinth:modmenu:${modmenuVersion}"
	modRuntimeOnly "maven.modrinth:modmenu:${modmenuVersion}"
}

processResources {
	inputs.property "version", resourceVersion
	inputs.property "minecraft_dependency", "~${minecraftVersion}"
	inputs.property "loader_dependency", ">=${loaderVersion}"
	inputs.property "java_dependency", ">=${javaRelease}"
	inputs.property "modmenu_entrypoint", "com.coffee.disguises.client.compat.ModMenuApiImpl"
	filesMatching("fabric.mod.json") {
		expand(
				"version": resourceVersion,
				"minecraft_dependency": "~${minecraftVersion}",
				"loader_dependency": ">=${loaderVersion}",
				"java_dependency": ">=${javaRelease}",
				"modmenu_entrypoint": "com.coffee.disguises.client.compat.ModMenuApiImpl"
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveClassifier = "mc26.1.2"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	from("${repoRoot}/LICENSE") {
		rename { "${it}_${archiveBaseName}" }
	}
}

// MC 26.1.2 runs Fabric in the Mojang-mapped ("named") namespace at runtime — there is
// no published intermediary for this version, and distributed mods (fabric-api,
// simple-voice-chat, etc.) ship referencing net.minecraft.* mojmap names. Loom's
// fabric-loom-remap default targets the "official" (obfuscated) namespace here, which
// produces references like `cgk` that do not exist at runtime, causing
// NoClassDefFoundError on load. Force the production jars into the runtime namespace.
tasks.withType(net.fabricmc.loom.task.RemapJarTask).configureEach {
	targetNamespace = "named"
}
