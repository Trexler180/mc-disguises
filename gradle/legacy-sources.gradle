// Lets every older Minecraft target build from the shared src/main/java, which is
// written against the primary (newest) target.
//
// Two mechanisms, for two kinds of API difference:
//
//   * Token-level renames and newer-only enum entries are rewritten here, in
//     generated copies of the handful of files that need them (LEGACY_SOURCE_FILES).
//   * Differences in the *shape* of an API (different constructors, a different
//     packet, a different mixin target) live in small classes with one copy in
//     src/main/java (newest API) and one in versions/_legacy-common/src/main/java
//     (pre-26.3 API, shared by every legacy target).  LEGACY_OVERRIDE_FILES lists
//     them.  Keep those classes tiny and their signatures identical.
//
// Before this existed, versions/_legacy-common held hand-maintained duplicates of
// DisguiseType.java, MetadataBuilder.java and PacketInterceptor.java — 3,724 lines
// copied to change nine tokens.  Every fix to PacketInterceptor (the core of the
// mod) had to be mirrored by hand or the legacy jars silently drifted.
//
// Token rewrites, by the version that introduced the newer name:
//   26.3: monster.EnderMan -> monster.Enderman
//   26.2: EntityTypes -> EntityType; monster.cubemob.Slime -> monster.Slime
// plus `//#if MC>=X` ... `//#endif` blocks, kept only when the target is >= X.

ext.LEGACY_SOURCE_FILES = [
        "com/coffee/disguises/disguise/DisguiseType.java",
        "com/coffee/disguises/packet/MetadataBuilder.java",
        "com/coffee/disguises/packet/PacketInterceptor.java",
]

ext.LEGACY_OVERRIDE_FILES = [
        "com/coffee/disguises/compat/PacketCompat.java",
        "com/coffee/disguises/mixin/LivingEntitySwingMixin.java",
]

// Compares dotted Minecraft versions numerically ("26.1.2" < "26.2" < "26.3").
ext.compareMcVersions = { String a, String b ->
    List<Integer> pa = a.tokenize('.').collect { it as int }
    List<Integer> pb = b.tokenize('.').collect { it as int }
    for (int i = 0; i < Math.max(pa.size(), pb.size()); i++) {
        int x = i < pa.size() ? pa[i] : 0
        int y = i < pb.size() ? pb[i] : 0
        if (x != y) return x <=> y
    }
    return 0
}

// Rewrites one shared source file into its equivalent for Minecraft `mcVersion`.
ext.transformLegacySource = { String source, String mcVersion ->
    def atLeast = { String v -> compareMcVersions(mcVersion, v) >= 0 }
    StringBuilder out = new StringBuilder(source.length())
    boolean skipping = false
    Set<String> seenImports = new HashSet<String>()

    source.eachLine { String line ->
        String trimmed = line.trim()

        def guard = trimmed =~ /^\/\/#if MC>=([0-9.]+)$/
        if (guard.matches()) { skipping = !atLeast(guard.group(1)); return }
        if (trimmed.startsWith("//#if ")) {
            throw new GradleException("Unsupported source guard (only `//#if MC>=X`): ${trimmed}")
        }
        if (trimmed == "//#endif") { skipping = false; return }
        if (skipping) return

        if (!atLeast("26.3")) {
            line = line.replace("net.minecraft.world.entity.monster.Enderman;",
                    "net.minecraft.world.entity.monster.EnderMan;")
            line = line.replaceAll(/\bEnderman\.class\b/, "EnderMan.class")
        }
        if (!atLeast("26.2")) {
            // \b anchors matter: `disabledEntityTypes` must not be rewritten.
            line = line.replaceAll(/\bEntityTypes\b/, "EntityType")
            line = line.replace("net.minecraft.world.entity.monster.cubemob.Slime",
                    "net.minecraft.world.entity.monster.Slime")
        }

        // DisguiseType imports both EntityType and EntityTypes; after the rename
        // those collapse into the same import. Duplicates are legal Java but noisy.
        String rewritten = line.trim()
        if (rewritten.startsWith("import ") && !seenImports.add(rewritten)) return

        out.append(line).append('\n')
    }
    return out.toString()
}

// Registers the generation task, excludes the newest-API originals from the main
// source set, and feeds the rewritten copies plus the legacy overrides to javac.
//
// Deliberately does not touch java.srcDirs: each version build declares its own
// (plus any per-version override directory), and quietly reassigning it here
// would make that declaration a lie.
ext.applyLegacySources = { String repoRoot, String mcVersion ->
    File sharedSrcRoot = file("${repoRoot}/src/main/java")
    File overrideRoot = file("${repoRoot}/versions/_legacy-common/src/main/java")
    File outRoot = new File(layout.buildDirectory.get().asFile, "generated/sources/legacy/java")
    List<String> relPaths = LEGACY_SOURCE_FILES
    List<String> overridePaths = LEGACY_OVERRIDE_FILES

    // Captured into locals so the doLast body below resolves them from its own
    // scope rather than walking the closure owner chain out to project.ext,
    // which does not reliably reach a script-plugin ext property at exec time.
    def transform = transformLegacySource

    def generate = tasks.register("generateLegacySources") {
        group = "build"
        description = "Rewrites newer-only API symbols so legacy targets build from the shared sources."

        inputs.files(relPaths.collect { new File(sharedSrcRoot, it) })
                .withPropertyName("sharedSources")
        inputs.property("mcVersion", mcVersion)
        outputs.dir(outRoot).withPropertyName("generatedSources")

        doLast {
            outRoot.deleteDir()
            relPaths.each { String rel ->
                File dst = new File(outRoot, rel)
                dst.parentFile.mkdirs()
                dst.write(transform(new File(sharedSrcRoot, rel).getText("UTF-8"), mcVersion), "UTF-8")
            }
        }
    }

    // The newest-API originals must not reach javac for a legacy target.
    (relPaths + overridePaths).each { sourceSets.main.java.exclude(it) }

    tasks.named("compileJava", JavaCompile) {
        dependsOn(generate)
        source(fileTree(outRoot))
        source(files(overridePaths.collect { new File(overrideRoot, it) }))
    }
}
